<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Réassort{% endblock %}</title>
</head>

<body>
    <nav>
        {% if user.is_authenticated %}
            <span>Connecté : {{ user.username }}</span>
            <form method="post" action="{% url 'accounts:logout' %}">
                {% csrf_token %}
                <button type="submit">Se déconnecter</button>
            </form>
        {% else %}
            <a href="{% url 'accounts:login' %}">Se connecter</a>
        {% endif %}
        {% if user.profile.role == 'GROSSISTE' %}
            <a href="{% url 'accounts:wholesaler_dashboard' %}">Tableau de bord</a>
            <a href="{% url 'catalog:product_list' %}">Mes produits</a>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>

</html>
